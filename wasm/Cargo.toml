[package]
name = "eegspike-wasm"
version = "0.1.0"
edition = "2021"
description = "eegspike-core compiled to WebAssembly for the browser viewer"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
eegspike-core = { path = "../rust/core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
