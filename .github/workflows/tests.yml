name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install (uv)
        run: uv sync --extra dev
      - name: Lint (Ruff) and types (ty)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run ty check src
      - name: Build the Rust core for Python (PyO3) and for the browser (WebAssembly)
        run: |
          uv run maturin build --release -m rust/Cargo.toml
          uv pip install rust/target/wheels/*.whl
          cargo build --release --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown
          cp wasm/target/wasm32-unknown-unknown/release/eegspike_wasm.wasm src/eegspike/eegspike_core.wasm
      - name: Tests
        run: |
          uv run pytest -q
          cargo test --manifest-path rust/core/Cargo.toml
